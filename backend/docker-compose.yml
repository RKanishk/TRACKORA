version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: trackora-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: trackora
      POSTGRES_PASSWORD: trackora
      POSTGRES_DB: trackora
    ports:
      - "5432:5432"
    volumes:
      - trackora_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trackora"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  trackora_postgres_data:
